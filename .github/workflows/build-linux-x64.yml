name: Build Linux x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import app version
        run: |
          VERSION=$(python -c "from src.app_version import CURRENT_APP_VERSION; print(CURRENT_APP_VERSION)")

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download bundled FFmpeg
        run: |
          mkdir -p tools/ffmpeg/bin
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 -o ffmpeg-linux-x64.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir ffmpeg-extract
          tar -xJf ffmpeg-linux-x64.tar.xz -C ffmpeg-extract
          cp "$(find ffmpeg-extract -type f -name ffmpeg -perm -111 | head -n 1)" tools/ffmpeg/bin/ffmpeg
          find ffmpeg-extract -type f \( -iname "GPL*" -o -iname "LICENSE*" \) -print -quit | xargs -r -I{} cp "{}" tools/ffmpeg/LICENSE
          find ffmpeg-extract -type f -iname "README*" -print -quit | xargs -r -I{} cp "{}" tools/ffmpeg/README.txt
          chmod +x tools/ffmpeg/bin/ffmpeg

      - name: Download bundled Deno
        run: |
          mkdir -p tools/deno/bin
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          unzip deno.zip
          mv deno tools/deno/bin/deno
          chmod +x tools/deno/bin/deno

      - name: Verify bundled tools
        run: |
          tools/ffmpeg/bin/ffmpeg -version | head -n 1
          ldd tools/ffmpeg/bin/ffmpeg || true
          tools/deno/bin/deno --version

      - name: Validate Python files
        run: python -m compileall -q src tools test

      - name: Run unit tests
        run: python -m unittest discover -s test -p "test*.py" -q

      - name: Validate Linux single-instance lock
        run: python -c "from src.integrations.single_instance import SingleInstanceMutex; first = SingleInstanceMutex(); assert first.is_primary; second = SingleInstanceMutex(); assert not second.is_primary; second.close(); first.close(); third = SingleInstanceMutex(); assert third.is_primary; third.close(); third.close()"

      - name: Build Linux x64 app
        run: pyinstaller --clean myMusic-linux.spec

      - name: Validate packaged files
        run: |
          test -x dist/myMusic/myMusic
          test -x dist/myMusic/_internal/tools/ffmpeg/bin/ffmpeg
          test -x dist/myMusic/_internal/tools/deno/bin/deno
          test -f dist/myMusic/_internal/ytmusicapi/locales/en/LC_MESSAGES/base.mo
          test ! -e dist/myMusic/_internal/integrations/spicetify/mymusic-integration.js

      - name: Validate headless Linux startup
        run: |
          set +e
          ./dist/myMusic/myMusic --install-spicetify
          status=$?
          set -e
          test "$status" -eq 1

      - name: Create Linux x64 archive
        run: |
          tar -czf "myMusic-v${APP_VERSION}-linux-x64.tar.gz" -C dist myMusic
          sha256sum "myMusic-v${APP_VERSION}-linux-x64.tar.gz"

      - name: Upload Linux x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: "myMusic-v${{ env.APP_VERSION }}-linux-x64"
          path: "myMusic-v${{ env.APP_VERSION }}-linux-x64.tar.gz"
